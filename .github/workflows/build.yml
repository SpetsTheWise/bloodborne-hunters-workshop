name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install development dependency
        run: python -m pip install -r dev/requirements.txt
      - name: Build and verify core and real CPU bridge
        shell: powershell
        run: ./dev/verify.ps1 -SkipUI
      - name: Package
        shell: powershell
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HuntersWorkshop-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

